    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-postgres
          image: "postgres:17.6-alpine"
          command: [sh, -ec]
          args:
            - 'for i in $(seq 1 60); do pg_isready -d "$DATABASE_DSN" && exit 0; sleep 2; done; exit 1'
