# Source: calendar/templates/rabbitmq.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: calendar-rabbitmq
  namespace: calendar-hw16
  labels:
    app.kubernetes.io/name: calendar
    app.kubernetes.io/instance: calendar
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: calendar-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: calendar
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calendar
        app.kubernetes.io/instance: calendar
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: rabbitmq
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: "rabbitmq:4.1.4-alpine"
          ports:
            - {name: rabbitmq, containerPort: 5672}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: RABBITMQ_NODENAME, value: "rabbit@$(POD_NAME)"}
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: calendar-infrastructure, key: rabbitmq-user}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: calendar-infrastructure, key: rabbitmq-password}}
          startupProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "1Gi"

