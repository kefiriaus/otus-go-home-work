apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calendar-api
  namespace: calendar-hw16
  labels:
    app.kubernetes.io/name: calendar
    app.kubernetes.io/instance: calendar
    app.kubernetes.io/managed-by: Helm
spec:
  ingressClassName: "nginx"
  rules:
    - host: "calendar.local"
      http:
        paths:
          - path: /
            pathType: Prefix
