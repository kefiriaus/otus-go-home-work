# Source: calendar/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: calendar-postgres
  namespace: calendar-hw16
  labels:
    app.kubernetes.io/name: calendar
    app.kubernetes.io/instance: calendar
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: calendar-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: calendar
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calendar
        app.kubernetes.io/instance: calendar
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: "postgres:17.6-alpine"
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: calendar-infrastructure, key: postgres-user}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: calendar-infrastructure, key: postgres-password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: calendar-infrastructure, key: postgres-database}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          startupProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "1Gi"

