{{- if .Values.tests.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-integration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "calendar.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: integration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: integration
          image: {{ printf "%s:%s" .Values.images.integration.repository .Values.images.integration.tag | quote }}
          imagePullPolicy: {{ .Values.images.integration.pullPolicy }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          env:
            - name: CALENDAR_API_URL
              value: {{ default (printf "http://%s-api:%v" .Release.Name .Values.service.httpPort) .Values.tests.apiURL | quote }}
            - name: CALENDAR_TEST_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "calendar.secret" . }}
                  key: database-dsn
{{- end }}
