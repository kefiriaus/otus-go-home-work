{{- if not .Values.connections.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calendar.secret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "calendar.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-dsn: {{ include "calendar.databaseDSN" . | quote }}
  rabbitmq-url: {{ include "calendar.rabbitmqURL" . | quote }}
{{- end }}
---
{{- if or .Values.postgres.enabled .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-infrastructure
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "calendar.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-user: {{ .Values.postgres.user | quote }}
  postgres-password: {{ .Values.postgres.password | quote }}
  postgres-database: {{ .Values.postgres.database | quote }}
  rabbitmq-user: {{ .Values.rabbitmq.user | quote }}
  rabbitmq-password: {{ .Values.rabbitmq.password | quote }}
{{- end }}
